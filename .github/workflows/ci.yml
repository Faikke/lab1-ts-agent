name: CI

on:
  push:
    branches:
      - 'feature/**'
      - main
      - develop
      - master
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CI scripts
        run: ${{ runner.os == 'Windows' && 'ci.bat' || 'bash ./ci.sh' }}
        shell: ${{ runner.os == 'Windows' && 'cmd' || 'bash' }}
